{% extends "base.html" %}
{% block title %}Edit {{ song.title }} · PocketBeats{% endblock %}
{% block content %}
<div class="card" style="max-width:560px;margin:0 auto;">
  <h1 class="page-title">Edit “{{ song.title }}”</h1>
  <form method="post" enctype="multipart/form-data" class="styled">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions">
      <button type="submit" class="btn primary">Save changes</button>
      <a class="btn ghost" href="{% url 'music:song_detail' song.pk %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
