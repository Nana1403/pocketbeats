{% extends "base.html" %}
{% block title %}Upload · PocketBeats{% endblock %}
{% block content %}
<div class="card" style="max-width:560px;margin:0 auto;">
  <h1 class="page-title">Upload a song</h1>
  <p class="helptext" style="color:var(--muted)">
    Only upload music you created, purchased, or have permission to use.
  </p>
  <form method="post" enctype="multipart/form-data" class="styled">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions">
      <button type="submit" class="btn primary">Upload</button>
      <a class="btn ghost" href="{% url 'music:library' %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
